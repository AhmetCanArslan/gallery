[versions]
agp = "9.2.1"
kotlin = "2.3.10"
composeBom = "2026.09.00"
material3 = "1.5.0-beta01"
materialIcons = "1.7.8"
activityCompose = "1.12.4"
lifecycle = "2.10.0"
exifinterface = "1.4.2"
coil = "3.3.0"
telephoto = "0.19.0"
media3 = "1.10.1"
compileSdk = "37"
targetSdk = "36"
minSdk = "26"

[libraries]
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-animation = { module = "androidx.compose.animation:animation" }
compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "material3" }
compose-material-icons = { module = "androidx.compose.material:material-icons-extended", version.ref = "materialIcons" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
exifinterface = { module = "androidx.exifinterface:exifinterface", version.ref = "exifinterface" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-video = { module = "io.coil-kt.coil3:coil-video", version.ref = "coil" }
coil-gif = { module = "io.coil-kt.coil3:coil-gif", version.ref = "coil" }
telephoto-coil3 = { module = "me.saket.telephoto:zoomable-image-coil3", version.ref = "telephoto" }
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-ui-compose = { module = "androidx.media3:media3-ui-compose", version.ref = "media3" }
media3-transformer = { module = "androidx.media3:media3-transformer", version.ref = "media3" }
media3-effect = { module = "androidx.media3:media3-effect", version.ref = "media3" }

[bundles]
compose = [
    "compose-ui",
    "compose-foundation",
    "compose-animation",
    "compose-material3",
    "compose-material-icons",
    "activity-compose",
    "lifecycle-viewmodel-compose",
    "lifecycle-runtime-compose",
]
coil = ["coil-compose", "coil-video", "coil-gif"]
media3 = ["media3-exoplayer", "media3-ui-compose", "media3-transformer", "media3-effect"]

[plugins]
android = { id = "com.android.application", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
